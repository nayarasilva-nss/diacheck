name: Lembretes de checklist
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  lembretes:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o DiaCheck
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://diacheck.app.br/api/cron/lembretes
